  - id: NS-006
    classification: "Lexical"
    description: "Possessive normalization"
    pattern:
      type: regex
      pattern: "'s\b"
      replacement: "s"
    conditions:
      same_area: preferred
    confidence: 0.98
    false_positive_risk: low
    rationale: "Golds Green vs Gold's Green — apostrophe is optional"
