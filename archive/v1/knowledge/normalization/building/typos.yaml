# ── Typo Correction Strategies ──────────────────────────────────
# kb_version: 1.1
# classification: Lexical
#
# Common spelling errors and typos observed across sources.
# Risk: Low — these are unambiguous spelling errors.

strategies:
  - id: NS-012
    classification: "Lexical"
    description: "Viewe → View typo correction"
    pattern:
      type: string_replace
      from: "Viewe"
      to: "View"
    conditions:
      same_area: recommended
    confidence: 0.99
    false_positive_risk: low
    rationale: "'Viewe' is always a typo for 'View'"
    approved_by: system
    auto_apply: true
    source_applies: ["PROPi", "MahaRERA", "Housing.com", "99acres", "MagicBricks", "WhatsApp"]
    source_excludes: []
    history:
      applied: 2
      rejected: 0
    examples:
      - canonical: "Sea View"
        aliases: ["Sea Viewe"]
    provenance:
      trigger: "Manual inspection of PROPi listing data"
      source: "propi_buildings_clean.csv"
      created: "2026-06-26"

