  - id: NS-016
    classification: "Lexical"
    description: "Elitus Mulund Weast → Elitus (remove erroneous location suffix)"
    pattern:
      type: regex
      pattern: '\s+(Mulund\s+)?We(a|a)st$'
      replacement: ""
      flags: IGNORECASE
    conditions:
      same_developer: required
    confidence: 0.95
    false_positive_risk: low
    rationale: "Location name accidentally appended to building name"
    approved_by: system
    auto_apply: true
    source_applies: ["PROPi", "MahaRERA"]
    source_excludes: []
    history:
